<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highwood Feeders — Commercial Feedlot Management & Analytics Story</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC;--card:#FFFFFF;--line:#F1F5F9;--bd:#E2E8F0;
  --t1:#1A1A1A;--t2:#4A4A4A;--t3:#8A8A8A;--mute:#CFCFCF;--ink:#2E2E2E;
  --brand:#2563EB;--soft:#EFF6FF;
  --ok:#10B981;--okbg:#ECFDF5;
  --bad:#EF4444;--badbg:#FEF2F2;
  --warn:#D97706;--warnbg:#FFFBEB;
  box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F172A;--card:#162036;--line:#1E293B;--bd:#2A3750;
    --t1:#F1F5F9;--t2:#CBD5E1;--t3:#94A3B8;--mute:#3B4A63;--ink:#F1F5F9;
    --brand:#60A5FA;--soft:#1E2A44;
    --okbg:#0F2F26;--badbg:#3A1A1F;--warnbg:#3A2C12;
  }
}
:root[data-theme="dark"]{
  --bg:#0F172A;--card:#162036;--line:#1E293B;--bd:#2A3750;
  --t1:#F1F5F9;--t2:#CBD5E1;--t3:#94A3B8;--mute:#3B4A63;--ink:#F1F5F9;
  --brand:#60A5FA;--soft:#1E2A44;
  --okbg:#0F2F26;--badbg:#3A1A1F;--warnbg:#3A2C12;
}
*{box-sizing:border-box}
html{scroll-padding-top:125px}
body{
  margin:0;background:var(--bg);color:var(--t1);
  font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  line-height:1.5;font-variant-numeric:tabular-nums;
}
body::before{
  content:"";position:fixed;inset:0 0 auto;
  height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.w{max-width:1120px;margin:0 auto;padding:0 16px 80px}

/* TOP STICKY BAR */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--bd);margin-bottom:16px;
}
.br{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.br b{font-size:15px;font-weight:700}
.br>span{font-size:12px;color:var(--t3)}
.br a{color:var(--brand);text-decoration:none;font-weight:600}
.hc{display:flex;gap:6px;align-items:center}
.hc .sg button,.th{padding:3px 10px;font-size:12px}
.th{
  border:1px solid var(--bd);background:var(--card);border-radius:99px;
  display:grid;place-items:center;width:28px;height:26px;padding:0;
}

nav{display:flex;gap:6px;margin:8px 0;overflow-x:auto}
nav button,.sg button{
  border:1px solid var(--bd);background:var(--card);border-radius:99px;
  padding:5px 13px;font-size:12.5px;font-weight:500;color:var(--t2);white-space:nowrap;
}
nav button[aria-selected=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* FILTER CONTAINER PROPOSIONAL */
.fl-wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fl{
  display:flex;flex-wrap:wrap;border:1px solid var(--bd);background:var(--card);
  border-radius:12px;overflow:hidden;flex:1 1 auto;
}
.fg{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:4px 9px}
.fg+.fg{border-left:1px solid var(--bd)}
@media(max-width:850px){.fl{display:block}.fg+.fg{border-left:0;border-top:1px solid var(--bd)}}
.fg label{font-size:11px;font-weight:600;color:var(--t3);margin-right:2px}
.sg{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.sg button{padding:2px 8px;font-size:11px}
.sg button[aria-pressed=true]{
  background:var(--soft);color:var(--brand);border-color:var(--brand);font-weight:600;
}
.fl-meta{display:flex;gap:6px;align-items:center;white-space:nowrap}
.fl-badge{
  font-size:11.5px;font-weight:600;color:var(--t2);background:var(--line);
  padding:4px 10px;border-radius:99px;border:1px solid var(--bd);
}
.fl-reset{
  font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;
  border:1px solid var(--bd);background:var(--card);color:var(--t2);
}
.fl-reset:hover{background:var(--line);color:var(--t1)}
.fl-reset:disabled{opacity:0.4;cursor:not-allowed}

/* TYPOGRAPHY & CARDS */
h1{
  font-size:clamp(24px,3.5vw,38px);line-height:1.15;margin:0 0 8px;
  font-weight:800;letter-spacing:-.03em;max-width:32ch;
}
.sub{color:var(--t2);font-size:14px;margin:0 0 18px;max-width:68ch;line-height:1.55}
.g{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.c{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.02);grid-column:span 12;min-width:0;
}
@media(min-width:800px){
  .q{grid-column:span 3}
  .s6{grid-column:span 6}
  .s7{grid-column:span 7}
  .s5{grid-column:span 5}
  .s4{grid-column:span 4}
  .s8{grid-column:span 8}
}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;font-weight:500;color:var(--t2)}
.hd .bg{margin-left:auto}
.ic{width:28px;height:28px;border-radius:9px;background:var(--line);display:grid;place-items:center;color:var(--t2)}
.bg{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px}
.ok{background:var(--okbg);color:var(--ok)}
.bad{background:var(--badbg);color:var(--bad)}
.wn{background:var(--warnbg);color:var(--warn)}
.v{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.in{font-size:12px;color:var(--t3);margin:4px 0 6px}
.in b{color:var(--t2);font-weight:600}
h2{font-size:16.5px;line-height:1.3;margin:0 0 4px;font-weight:700;letter-spacing:-.01em;max-width:50ch}
.cs{font-size:12px;color:var(--t3);margin:0 0 12px}
.go{text-align:left;cursor:pointer;border:1px solid var(--bd);background:var(--card)}
.go:hover{border-color:var(--brand)}
.go .in{margin:6px 0 0;color:var(--brand);font-weight:500}
.bar{margin-bottom:9px}
.bar-hd{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:3px}
.bar-track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:99px;background:var(--brand);transition:width .35s ease}
.bar-fill.ok{background:var(--ok)}
.bar-fill.warn{background:var(--warn)}
.bar-fill.bad{background:var(--bad)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:580px}
.tbl th{text-align:left;padding:7px 9px;font-size:11.5px;font-weight:700;color:var(--t3);border-bottom:1px solid var(--bd);white-space:nowrap}
.tbl td{padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--line)}
.tbl td.num{text-align:right;font-weight:600}
.tbl th.num{text-align:right}
.wf-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
@media(max-width:768px){.wf-grid{grid-template-columns:repeat(2,1fr)}}
.wf-box{background:var(--line);border-radius:12px;padding:12px;text-align:center}
.wf-lbl{font-size:11.5px;font-weight:600;color:var(--t3);margin-bottom:3px}
.wf-val{font-size:16px;font-weight:800}
.wf-sub{font-size:11px;color:var(--t2);margin-top:2px}
.rec{border-left:4px solid var(--brand)}
.rec p{margin:8px 0;font-size:13px;max-width:76ch;color:var(--t2);line-height:1.55}
.rec b{color:var(--t1)}
.ft{font-size:12px;color:var(--t3);margin-top:22px;max-width:80ch;line-height:1.6}
.wm{
  position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;
  display:flex;gap:7px;align-items:center;background:var(--card);border:1px solid var(--bd);
  border-radius:99px;padding:6px 12px;font-size:12px;color:var(--t3);text-decoration:none;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.wm:hover{border-color:var(--brand)}
.wm b{color:var(--t1);font-weight:600}
.wm svg{width:14px;height:14px;fill:var(--brand)}
#tip{
  position:fixed;z-index:40;background:var(--ink);color:var(--card);
  font-size:12px;padding:6px 10px;border-radius:8px;pointer-events:none;
  max-width:260px;box-shadow:0 3px 10px rgba(0,0,0,.15);transform:translate(-50%,-120%);
}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--t2);font-family:inherit}
[hidden]{display:none!important}
</style></head>

function getFilteredLots() {
  return LOTS.filter(l => {
    if (S.z >= 0 && l.z !== S.z) return false;
    if (S.b >= 0 && l.b !== S.b) return false;
    if (S.s >= 0 && l.s !== S.s) return false;
    if (S.pt >= 0 && l.pt !== S.pt) return false;
    return true;
  });
}

// DETERMINISTIC DYNAMIC METRIC ENGINE
function computeMetrics(FL) {
  const headIn = FL.reduce((s, l) => s + l.headIn, 0);
  const sold = FL.reduce((s, l) => s + l.sold, 0);
  const mort = FL.reduce((s, l) => s + l.mort, 0);
  const mortRate = headIn ? (mort / headIn * 100) : 0;
  
  const wAvg = key => sold ? (FL.reduce((s, l) => s + l[key] * l.sold, 0) / sold) : 0;
  const wAvgIn = key => headIn ? (FL.reduce((s, l) => s + l[key] * l.headIn, 0) / headIn) : 0;
  
  const adg = wAvg('adg');
  const fcr = wAvg('fcr');
  const dof = wAvg('dof');
  const margin = wAvg('margin');
  const totMargin = FL.reduce((s, l) => s + l.totMargin, 0);
  const cog = wAvg('cog');
  const fcog = wAvg('fcog');
  const pCost = wAvgIn('pCost');
  const fCost = wAvg('fCost');
  const yCost = wAvg('yCost');
  const vCost = wAvg('vCost');
  const gRev = wAvg('gRev');
  const dressing = wAvg('dressing');
  const hotW = wAvg('hotW');
  const totCost = pCost + fCost + yCost + vCost;
  
  // Health & morbidity
  const sick = FL.reduce((s, l) => s + l.sickCount, 0);
  const healthy = FL.reduce((s, l) => s + l.healthyCount, 0);
  const morbRate = headIn ? (sick / headIn * 100) : 0;
  const brd = FL.reduce((s, l) => s + l.brd, 0);
  const footRot = FL.reduce((s, l) => s + l.footRot, 0);
  const bloat = FL.reduce((s, l) => s + l.bloat, 0);
  const buller = FL.reduce((s, l) => s + l.buller, 0);
  
  // Accurate morbidity drag calculated from lot-level healthy vs sick margins
  const hMargin = sold ? (FL.reduce((s, l) => s + l.healthyMargin * Math.max(0, l.sold - Math.max(0, l.sickCount - l.mort)), 0) / Math.max(1, sold - Math.max(0, sick - mort))) : 0;
  const sMargin = sold ? (FL.reduce((s, l) => s + l.sickMargin * Math.max(0, l.sickCount - l.mort), 0) / Math.max(1, Math.max(0, sick - mort))) : 0;
  const morbDrag = Math.max(0, hMargin - sMargin);
  
  // Carcass grades
  const prime = FL.reduce((s, l) => s + l.prime, 0);
  const aaa = FL.reduce((s, l) => s + l.aaa, 0);
  const aa = FL.reduce((s, l) => s + l.aa, 0);
  const bGr = FL.reduce((s, l) => s + l.bGr, 0);
  const primeAaaPct = sold ? ((prime + aaa) / sold * 100) : 0;
  
  // Scale trajectory averages
  const scaleH = [0, 1, 2, 3, 4].map(idx => {
    return sold ? (FL.reduce((s, l) => s + (l.scaleH[idx] || 0) * l.sold, 0) / sold) : 0;
  });
  const scaleS = [0, 1, 2, 3, 4].map(idx => {
    return sold ? (FL.reduce((s, l) => s + (l.scaleS[idx] || 0) * l.sold, 0) / sold) : 0;
  });
  const sickDeficitKg = Math.max(0, (scaleH[4] || 0) - (scaleS[4] || 0));
  
  // Daily DMI
  const dmiHeadDay = dof ? (wAvg('dmi') / dof) : 10.4;

  // Frame score metrics
  const lgSoldTot = FL.reduce((s, l) => s + l.lgSold, 0);
  const medSoldTot = FL.reduce((s, l) => s + l.medSold, 0);
  const lgMargin = lgSoldTot ? (FL.reduce((s, l) => s + l.lgMargin * l.lgSold, 0) / lgSoldTot) : 0;
  const medMargin = medSoldTot ? (FL.reduce((s, l) => s + l.medMargin * l.medSold, 0) / medSoldTot) : 0;
  const lgHCW = lgSoldTot ? (FL.reduce((s, l) => s + l.lgHCW * l.lgSold, 0) / lgSoldTot) : 0;
  const medHCW = medSoldTot ? (FL.reduce((s, l) => s + l.medHCW * l.medSold, 0) / medSoldTot) : 0;
  const lgAdg = lgSoldTot ? (FL.reduce((s, l) => s + l.lgAdg * l.lgSold, 0) / lgSoldTot) : 0;
  const medAdg = medSoldTot ? (FL.reduce((s, l) => s + l.medAdg * l.medSold, 0) / medSoldTot) : 0;
  const frameDeltaMargin = lgMargin - medMargin;
  const frameDeltaHCW = lgHCW - medHCW;

  // Charolais vs Angus carcass weight gap
  const charLots = FL.filter(l => l.b === 1);
  const angusLots = FL.filter(l => l.b === 0);
  const charSold = charLots.reduce((s, l) => s + l.sold, 0);
  const angusSold = angusLots.reduce((s, l) => s + l.sold, 0);
  const charHCW = charSold ? (charLots.reduce((s, l) => s + l.hotW * l.sold, 0) / charSold) : 391.8;
  const angusHCW = angusSold ? (angusLots.reduce((s, l) => s + l.hotW * l.sold, 0) / angusSold) : 380.0;
  const charAngusGapHCW = Math.max(0, charHCW - angusHCW);

  // Winter placement lots (Q3 & Q4 arrivals on cold season closeout)
  const winterLots = FL.filter(l => l.q === 2 || l.q === 3);
  const winterSold = winterLots.reduce((s, l) => s + l.sold, 0);
  const winterFCR = winterSold ? (winterLots.reduce((s, l) => s + l.fcr * l.sold, 0) / winterSold) : 7.05;

  // Origin region tokens
  const mbLots = FL.filter(l => l.reg === 3);
  const mbSold = mbLots.reduce((s, l) => s + l.sold, 0);
  const mbMargin = mbSold ? (mbLots.reduce((s, l) => s + l.margin * l.sold, 0) / mbSold) : 296.64;
  const saLots = FL.filter(l => l.reg === 0);
  const saHeadIn = saLots.reduce((s, l) => s + l.headIn, 0);
  const saMorb = saHeadIn ? (saLots.reduce((s, l) => s + l.sickCount, 0) / saHeadIn * 100) : 13.4;

  // Quarterly tokens: finding best and worst placement quarters in active cohort
  const quarterStats = QUARTERS.map((qName, qIdx) => {
    const qLots = FL.filter(l => l.q === qIdx);
    const qSold = qLots.reduce((s, l) => s + l.sold, 0);
    const qHead = qLots.reduce((s, l) => s + l.headIn, 0);
    return {
      name: qName,
      sold: qSold,
      head: qHead,
      feederP: qHead ? (qLots.reduce((s, l) => s + l.feederP * l.headIn, 0) / qHead) : 0,
      fcog: qSold ? (qLots.reduce((s, l) => s + l.fcog * l.sold, 0) / qSold) : 0,
      margin: qSold ? (qLots.reduce((s, l) => s + l.margin * l.sold, 0) / qSold) : 0
    };
  }).filter(q => q.sold > 0);

  const sortedQ = [...quarterStats].sort((a, b) => a.margin - b.margin);
  const worstQ = sortedQ.length ? sortedQ[0] : { name: '2024Q2', feederP: 5.83, fcog: 2.35, margin: 258.32 };
  const bestQ = sortedQ.length ? sortedQ[sortedQ.length - 1] : { name: '2025Q1', feederP: 5.74, fcog: 2.30, margin: 341.54 };

  // Drug protocols dynamically aggregated from active lots
  const drugStats = DRUGS.map((dName, dIdx) => {
    const cases = FL.reduce((s, l) => s + l.drugs[dIdx][0], 0);
    const recov = FL.reduce((s, l) => s + l.drugs[dIdx][1], 0);
    const mortD = FL.reduce((s, l) => s + l.drugs[dIdx][2], 0);
    const costTot = FL.reduce((s, l) => s + l.drugs[dIdx][3], 0);
    return {
      name: dName,
      cases,
      recovPct: cases ? (recov / cases * 100) : 0,
      mortPct: cases ? (mortD / cases * 100) : 0,
      avgCost: cases ? (costTot / cases) : 0
    };
  });

  return {
    headIn, sold, mort, mortRate, adg, fcr, dof, margin, totMargin,
    cog, fcog, pCost, fCost, yCost, vCost, gRev, totCost, dressing, hotW,
    sick, healthy, morbRate, brd, footRot, bloat, buller,
    hMargin, sMargin, morbDrag, sickDeficitKg,
    prime, aaa, aa, bGr, primeAaaPct,
    scaleH, scaleS, dmiHeadDay,
    lgSoldTot, medSoldTot, lgMargin, medMargin, lgHCW, medHCW, lgAdg, medAdg,
    frameDeltaMargin, frameDeltaHCW, charAngusGapHCW, winterFCR,
    mbMargin, saMorb, worstQ, bestQ,
    drugStats
  };
}

// TAB 1: PAKAN DAN DINGIN (FEED AND WINTER)
function p1(M, FL) {
  if (FL.length === 0) {
    return `<div class="c s12"><p class="cs">${x('Tidak ada data yang sesuai filter.', 'No data matching selected filters.')}</p></div>`;
  }

  const barnLots = FL.filter(l => l.pt === 1);
  const openLots = FL.filter(l => l.pt !== 1);
  const barnSold = barnLots.reduce((s, l) => s + l.sold, 0);
  const openSold = openLots.reduce((s, l) => s + l.sold, 0);
  const barnMargin = barnSold ? (barnLots.reduce((s, l) => s + l.margin * l.sold, 0) / barnSold) : 0;
  const openMargin = openSold ? (openLots.reduce((s, l) => s + l.margin * l.sold, 0) / openSold) : 0;
  const barnEdge = (barnSold && openSold) ? (barnMargin - openMargin) : (barnSold ? barnMargin : 0);

  const chartW = 700;
  const chartH = 190;
  const padL = 40;
  const padR = 25;
  const padT = 24;
  const padB = 26;
  const usableW = chartW - padL - padR;
  const usableH = chartH - padT - padB;

  const minDmi = 8;
  const maxDmi = 16;
  const getDmiY = v => padT + (1 - (v - minDmi) / (maxDmi - minDmi)) * usableH;
  const getDmiX = i => padL + (i / (MONTHS.length - 1)) * usableW;

  const points = DMI_HEAD_DAY.map((val, i) => `${getDmiX(i).toFixed(1)},${getDmiY(val).toFixed(1)}`).join(' ');
  const areaPoints = `${padL},${padT + usableH} ${points} ${chartW - padR},${padT + usableH}`;

  const dmiTicks = [8, 10, 12, 14, 16];

    { start: 0, end: 2.5, lbl: x('Dingin 2024', 'Winter 2024') },
    { start: 9.5, end: 14.5, lbl: x('Dingin 2024/25 (barley mahal)', 'Winter 2024/25 (pricey barley)') },
    { start: 21.5, end: 23, lbl: x('Dingin 2025', 'Winter 2025') }

  return `
    <h1>${x('Dingin bikin sapi makan lebih banyak tapi tumbuh lebih lambat', 'Cold pushes intake up and gain down')}</h1>
    <p class="sub">${x('Sebagian pakan habis jadi panas badan, bukan daging. Confinement Barn menyelamatkan $49,82 per ekor dibanding open dirt.', 'Part of the ration burns off as body heat instead of beef. Confinement Barns recover $49.82 per head over open dirt.')}</p>

    <div class="g">
      ${card('t', x('Asupan pakan (DMI)', 'Dry matter intake (DMI)'), '<span class="bg wn">2.28% BW</span>', `${n(M.dmiHeadDay, 1)} kg`, x('Bahan kering pakan per ekor per hari', 'Dry matter intake per head/day'), x('Rata-rata asupan harian bahan kering pakan', 'Daily DMI average'))}
      ${card('s', x('Konversi pakan (FCR)', 'Feed conversion (FCR)'), `<span class="bg ${M.fcr<=6.7?'ok':'wn'}">${n(M.fcr, 2)}</span>`, `${n(M.fcr, 2)}`, x('kg pakan bahan kering per kg tambah bobot', 'kg DM feed per kg of gain'), x('Rasio pakan FCR', 'Feed conversion ratio'))}
      ${card('d', x('Biaya pakan per kg tambah bobot (FCOG)', 'Feed cost of gain (FCOG)'), `<span class="bg ok">${cur(M.fcog, 2)}/kg</span>`, cur(M.fcog, 2), x('Biaya pakan per kg kenaikan bobot', 'Feed expense per kg of live gain'), x('Feed Cost of Gain', 'Feed Cost of Gain'))}
      ${card('u', x('Selisih margin barn vs open dirt', 'Barn vs open dirt margin gap'), `<span class="bg ok">${barnEdge>=0?'+':''}${cur(barnEdge, 2)}</span>`, `${barnEdge>=0?'+':''}${cur(barnEdge, 2)}`, x('Keunggulan kandang tertutup atas kandang terbuka', 'Confinement barn margin edge over open dirt'), x('Selisih margin kandang tertutup atas terbuka', 'Confinement barn margin edge'))}

            </linearGradient>
          </defs>

          ${winterBands.map(wb => {
            const x1 = padL + (wb.start / (MONTHS.length - 1)) * usableW;

            return `

          ${dmiTicks.map(t => `

          ${DMI_HEAD_DAY.map((val, i) => `

          <text x="${padL}" y="${chartH - 6}" font-size="9.5" fill="var(--t3)">Jan 2024</text>

          <text x="${chartW - padR}" y="${chartH - 6}" font-size="9.5" fill="var(--t3)" text-anchor="end">Des 2025</text>
        </svg>
      </div>

      <!-- Shelter Comparison -->
      <div class="c s4">
        <h2>${x('Tiga tipe naungan, tiga hasil', 'Three shelter types, three outcomes')}</h2>
        <p class="cs">${x('Pertumbuhan dan margin berdasarkan tipe kandang', 'Growth and margin metrics by shelter type')}</p>
        
        ${PEN_TYPES.map((ptName, ptIdx) => {
          const ptLots = FL.filter(l => l.pt === ptIdx);
          const ptSold = ptLots.reduce((s, l) => s + l.sold, 0);
          const ptMargin = ptSold ? (ptLots.reduce((s, l) => s + l.margin * l.sold, 0) / ptSold) : 0;
          const ptAdg = ptSold ? (ptLots.reduce((s, l) => s + l.adg * l.sold, 0) / ptSold) : 0;
          const ptFcr = ptSold ? (ptLots.reduce((s, l) => s + l.fcr * l.sold, 0) / ptSold) : 0;
          return `
            <div style="background:var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px" data-tip="${ptName}: Margin ${cur(ptMargin, 2)}, FCR ${n(ptFcr, 2)}, ADG ${n(ptAdg, 3)}">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
                <b style="font-size:12.5px">${ptName}</b>
                <span class="bg ${ptSold?(ptIdx===1?'ok':'wn'):''}">${ptSold ? cur(ptMargin, 2) : '-'}</span>

      <!-- Origin Region Table -->

        <div class="tbl-wrap">
          <table class="tbl">

            </thead>
            <tbody>
              ${REGIONS.map((rName, rIdx) => {
                const rLots = FL.filter(l => l.reg === rIdx);
                const rSold = rLots.reduce((s, l) => s + l.sold, 0);
                const rHeadIn = rLots.reduce((s, l) => s + l.headIn, 0);
                if (rHeadIn === 0) return '';
                const rFeederP = rLots.reduce((s, l) => s + l.feederP * l.headIn, 0) / rHeadIn;
                const rMorb = rHeadIn ? (rLots.reduce((s, l) => s + l.sickCount, 0) / rHeadIn * 100) : 0;
                const rFcr = rSold ? (rLots.reduce((s, l) => s + l.fcr * l.sold, 0) / rSold) : 0;
                const rMargin = rSold ? (rLots.reduce((s, l) => s + l.margin * l.sold, 0) / rSold) : 0;
                return `
                  <tr>
                    <td><b>${rName}</b></td>
                    <td class="num">${cur(rFeederP, 2)}</td>

        <div class="tbl-wrap">
          <table class="tbl">
            <thead>
              <tr>
                <th>${x('Kuartal Masuk', 'Placement Qtr')}</th>
                <th class="num">${x('Beli $/kg', 'Feeder $/kg')}</th>

                const qFeederP = qLots.reduce((s, l) => s + l.feederP * l.headIn, 0) / qHeadIn;

        </div>

          ${x(`Bibit mahal plus pakan mahal = margin tipis. ${M.worstQ.name}: bibit ${cur(M.worstQ.feederP, 2)}/kg, COG pakan ${cur(M.worstQ.fcog, 2)}/kg, margin ${cur(M.worstQ.margin, 2)}/ekor. Bandingkan ${M.bestQ.name}: ${cur(M.bestQ.margin, 2)}/ekor.`, `Pricey feeders plus pricey feed means thin margin. ${M.worstQ.name}: feeders ${cur(M.worstQ.feederP, 2)}/kg, feed COG ${cur(M.worstQ.fcog, 2)}/kg, margin ${cur(M.worstQ.margin, 2)}/head. Compare ${M.bestQ.name}: ${cur(M.bestQ.margin, 2)}/head.`)}

// TAB 2: GROWTH, PULLS, DRUG COSTS
function p2(M, FL) {
  if (FL.length === 0) {
    return `<div class="c s12"><p class="cs">${x('Tidak ada data yang sesuai filter.', 'No data matching selected filters.')}</p></div>`;
  }

  const chartW = 700;
  const chartH = 200;
  const padL = 40;
  const padR = 25;
  const padT = 18;
  const padB = 26;
  const usableW = chartW - padL - padR;
  const usableH = chartH - padT - padB;

  const allW = [...M.scaleH, ...M.scaleS].filter(v => v > 0);
  const minW = allW.length ? Math.floor(Math.min(...allW) / 50) * 50 - 20 : 280;
  const maxW = allW.length ? Math.ceil(Math.max(...allW) / 50) * 50 + 20 : 680;
  
  const getY = val => padT + (1 - (val - minW) / (maxW - minW)) * usableH;
  const getX = idx => padL + (idx / 4) * usableW;

  const ptsHealthy = M.scaleH.map((v, i) => `${getX(i).toFixed(1)},${getY(v).toFixed(1)}`).join(' ');
  const ptsTreated = M.scaleS.map((v, i) => `${getX(i).toFixed(1)},${getY(v).toFixed(1)}`).join(' ');

  const STAGES = x(['Masuk', 'Hari 35', 'Hari 70', 'Hari 105', 'Closeout'], ['Arrival', 'Day 35', 'Day 70', 'Day 105', 'Closeout']);

  const drugIndications = {
    'Tulathromycin': x('BRD akut, lini pertama', 'acute BRD, first line'),
    'Florfenicol': x('BRD dengan demam tinggi', 'BRD with high fever'),
    'Oxytetracycline': x('busuk kuku', 'foot rot'),
    'Ceftiofur': x('BRD yang gagal terapi pertama', 'BRD after first treatment fails'),
    'Supportive Therapy': x('kembung dan asidosis', 'bloat and acidosis')
  };

  return `
    <h1>${x('30 hari pertama menentukan sapi hidup atau mati, dan berat akhirnya', 'The first 30 days decide survival and closeout weight')}</h1>

    <div class="g">
      ${card('d', x('Prime + AAA', 'Prime + AAA'), `<span class="bg ok">${n(M.primeAaaPct, 1)}%</span>`, `${n(M.primeAaaPct, 1)}%`, x('Raih bonus grid CBGA karkas', 'Captures carcass grid bonus'), x('Karkas berkualitas marbling tinggi', 'High-marbling carcasses'))}

      ${card('u', x('Bobot karkas panas (HCW)', 'Hot carcass weight (HCW)'), `<span class="bg ok">${n(M.hotW, 1)} kg</span>`, `${n(M.hotW, 1)} kg`, x('Rata-rata bobot karkas di packer', 'Average hot carcass weight at plant'), x('Rata-rata bobot karkas panas', 'Hot Carcass Weight average'))}
      ${card('d', x('Margin per ekor', 'Margin per head'), `<span class="bg ${M.margin>=0?'ok':'bad'}">${cur(M.margin, 2)}</span>`, cur(M.margin, 2), x('Margin bersih per ekor sapi terjual', 'Realized net margin per head sold'), x('Laba bersih per ekor sapi terjual', 'Net margin per sold head'))}

      <!-- Breed Table -->

        <h2>${x('Hasil karkas per ras di grid packer', 'Carcass results by breed on the packer grid')}</h2>
        <p class="cs">${x(`Data ${n(M.sold, 0)} ekor sapi terjual pada sistem Canadian Beef Grading Agency (CBGA)`, `Closeout data across ${n(M.sold, 0)} finished sales under CBGA grid specifications`)}</p>
        
        <div class="tbl-wrap">
          <table class="tbl">
            <thead>
              <tr>
                <th>${x('Ras sapi', 'Cattle breed')}</th>

                <th class="num">${x('Bobot karkas', 'Hot carcass wt')}</th>
                <th class="num">${x('Canada Prime', 'Prime %')}</th>
                <th class="num">${x('Canada AAA', 'AAA %')}</th>
                <th class="num">${x('Canada AA', 'AA %')}</th>
                <th class="num">${x('B-Grade / Diskon', 'B-Grade %')}</th>
                <th class="num">${x('Margin per ekor', 'Net margin / head')}</th>
              </tr>
            </thead>
            <tbody>
              ${BREEDS.map((bName, bIdx) => {
                const bLots = FL.filter(l => l.b === bIdx);
                const bSold = bLots.reduce((s, l) => s + l.sold, 0);
                if (bSold === 0) return '';
                const bDressing = bLots.reduce((s, l) => s + l.dressing * l.sold, 0) / bSold;
                const bHotW = bLots.reduce((s, l) => s + l.hotW * l.sold, 0) / bSold;
                const bPrime = bLots.reduce((s, l) => s + l.prime, 0) / bSold * 100;
                const bAaa = bLots.reduce((s, l) => s + l.aaa, 0) / bSold * 100;
                const bAa = bLots.reduce((s, l) => s + l.aa, 0) / bSold * 100;
                const bGr = bLots.reduce((s, l) => s + l.bGr, 0) / bSold * 100;
                const bMargin = bLots.reduce((s, l) => s + l.margin * l.sold, 0) / bSold;
                return `

                    <td><b>${bName}</b></td>
                    <td class="num">${n(bSold, 0)}</td>

      <!-- Frame Score -->

            <div style="font-size:12px;color:var(--t2)">

              Populasi: <b>${n(M.lgSoldTot, 0)} ekor terjual</b>
            </div>
          </div>

          <div style="background:var(--line);border-radius:14px;padding:14px">
            <div style="font-size:12px;font-weight:700;color:var(--t3)">MEDIUM FRAME</div>
            <div style="font-size:24px;font-weight:800;color:var(--t1);margin:2px 0">${cur(M.medMargin, 2)} <span style="font-size:12px;font-weight:500;color:var(--t3)">/ekor</span></div>
            <div style="font-size:12px;color:var(--t2)">
              Bobot Karkas: <b>${n(M.medHCW, 1)} kg</b> &bull; ADG: <b>${n(M.medAdg, 3)} kg/d</b><br>
              Populasi: <b>${n(M.medSoldTot, 0)} ekor terjual</b>

          </div>

          <div style="background:var(--soft);border:1px solid var(--brand);border-radius:14px;padding:14px">
            <div style="font-size:12px;font-weight:700;color:var(--brand)">KEUNGGULAN LARGE FRAME</div>
            <div style="font-size:24px;font-weight:800;color:var(--brand);margin:2px 0">+${cur(M.frameDeltaMargin, 2)} <span style="font-size:12px;font-weight:500;color:var(--brand)">/ekor</span></div>
            <div style="font-size:12px;color:var(--t2)">
              Karkas Panas: <b>+${n(M.frameDeltaHCW, 1)} kg HCW</b><br>
              ${x(`Large Frame unggul ${cur(M.frameDeltaMargin, 2)}/ekor dan +${n(M.frameDeltaHCW, 1)} kg HCW`, `Large Frame advantage: ${cur(M.frameDeltaMargin, 2)}/head and +${n(M.frameDeltaHCW, 1)} kg HCW`)}
            </div>
          </div>
        </div>
      </div>

      <!-- Tactical Recommendations -->
      <div class="c s12 rec">
        <h2>${x('Rekomendasi taktis manajemen feedlot', 'Tactical recommendations for feedlot management')}</h2>
        
        <p><b>${x('Seimbangkan bibit.', 'Balance your feeder buys.')}</b> ${x('Charolais bawa margin tertinggi ($412/ekor), Simmental $344. Geser sekitar 60% pembelian ke keduanya, sisakan 40% Angus untuk bonus Prime dan AAA saat selisih AAA–AA melebar.', 'Charolais earns the top margin ($412/head), Simmental $344. Shift about 60% of purchases to the two, and keep 40% Angus for Prime and AAA bonuses when the AAA–AA spread widens.')}</p>
        
        <p><b>${x('Taruh bibit ringan di barn saat musim dingin.', 'Put light feeders in barns for winter.')}</b> ${x('Sapi di bawah 310 kg yang masuk Okt–Des sebaiknya ke Confinement Barn. Barn menghemat $49,82 per ekor dari beban dingin.', 'Calves under 310 kg placed Oct–Dec should go into Confinement Barns. Barns save $49.82 per head in cold drag.')}</p>
        
        <p><b>${x('Deteksi BRD lebih awal.', 'Catch BRD early.')}</b> ${x(`Bunk reading ketat di hari 5–25 setelah masuk. Sapi yang sempat sakit kehilangan ${cur(M.morbDrag, 0)}/ekor margin. Afkir sapi yang ditarik berulang sebelum hari ke-45, jangan terus diberi makan.`, `Read bunks closely on days 5–25 after arrival. Cattle that got sick lose ${cur(M.morbDrag, 0)}/head in margin. Cull repeat pulls before Day 45 instead of feeding them on.`)}</p>
      </div>

          ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'

  `).join('');

  // Filters with concise clean labels
  const fg = (label, key, arr) => `
    <div class="fg" role="group" aria-label="${label}">
      <label>${label}</label>
      <div class="sg">
        ${[x('Semua', 'All'), ...arr].map((val, i) => `
          <button data-k="${key}" data-v="${i - 1}" aria-pressed="${S[key] === (i - 1)}">${val}</button>
        `).join('')}

    </div>
  `;

  const breedShort = ['Angus', 'Charolais', 'Simmental', 'Hereford'];
  const zoneShort = ['North Yard', 'South Yard', 'East Sheltered'];
  const sexShort = ['Steer', 'Heifer'];
  const penShort = ['Windbreak', 'Confinement Barn', 'Open Dirt'];

  document.getElementById('fl').innerHTML = 
    fg(x('Zona', 'Zone'), 'z', zoneShort) +
    fg(x('Ras', 'Breed'), 'b', breedShort) +
    fg(x('Kelamin', 'Sex'), 's', sexShort) +
    fg(x('Naungan', 'Shelter'), 'pt', penShort);

  // Dynamic lot counter badge & reset filter button
  const isFiltered = S.z !== -1 || S.b !== -1 || S.s !== -1 || S.pt !== -1;
  document.getElementById('fl-meta').innerHTML = `
    <span class="fl-badge">${FL.length} ${x('dari', 'of')} ${LOTS.length} lot &bull; ${n(M.headIn, 0)} ${x('ekor', 'hd')}</span>
    <button class="fl-reset" data-k="reset" data-v="1" ${isFiltered ? '' : 'disabled'} title="${x('Reset semua filter', 'Reset all filters')}">
      ${x('Reset', 'Reset')}

  `;

  // Render active page with dynamic metrics
  const pages = [p0, p1, p2, p3];
  document.getElementById('app').innerHTML = pages[S.tab](M, FL);

  // Clean, professional footnote
  document.getElementById('ft').innerHTML = x(
    'Data simulasi: Highwood Feeders Ltd., Alberta Selatan. 15.000 sapi, 90 lot, 40 pen, 2024–2025. Grade karkas mengikuti standar Canadian Beef Grading Agency (CBGA).',
    'Simulated data: Highwood Feeders Ltd., Southern Alberta. 15,000 head, 90 lots, 40 pens, 2024–2025. Carcass grades follow Canadian Beef Grading Agency (CBGA) specs.'
  );

  document.getElementById('wm').innerHTML = `
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 20.5h-3.6v-5.6c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9v5.7H9.4V9h3.4v1.6c.5-.9 1.6-1.8 3.4-1.8 3.6 0 4.3 2.4 4.3 5.5v6.2zM5.3 7.4a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2zM7.1 20.5H3.6V9h3.5v11.5z"/></svg>
    <span>${x('Dibuat oleh', 'Created by')} <b>Rama Wijaya</b></span>
  `;
}

// Event listeners
const sv = () => {
  try {
    localStorage.setItem('hws_feedlot', JSON.stringify({ lg: S.lg, th: S.th }));
  } catch (e) {}
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  const g = e.target.closest('[data-go]');
  
  if (b) {
    const k = b.dataset.k;
    const v = b.dataset.v;
    if (k === 'reset') {
      S.z = -1;
      S.b = -1;
      S.s = -1;
      S.pt = -1;
      render();
      return;
    }
    S[k] = isNaN(+v) ? v : +v;
    if (k === 'tab') scrollTo(0, 0);
    if (k === 'lg' || k === 'th') sv();
    render();
  } else if (g) {
    S.tab = +g.dataset.go;
    scrollTo(0, 0);
    render();
  }
});

const tip = document.getElementById('tip');
const handleMove = e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t || !t.dataset.tip) {
    tip.hidden = true;
    return;
  }
  tip.textContent = t.dataset.tip;
  tip.hidden = false;
  tip.style.left = Math.max(8, Math.min(e.clientX, innerWidth - tip.offsetWidth / 2 - 12)) + 'px';
  tip.style.top = (e.clientY - 8) + 'px';
};

document.addEventListener('pointermove', handleMove);
document.addEventListener('pointerdown', handleMove);
document.addEventListener('pointerleave', () => tip.hidden = true);

render();
window.__S = S;
window.__R = render;
</script>
</body>
